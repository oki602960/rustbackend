services:
  - type: web
    name: open-coreui-backend
    runtime: go
    # Render's default Go build builds main.go at the root and outputs ./app
    buildCommand: go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    # Render injects PORT automatically; pass it through to the Go server
    startCommand: sh -c 'OPEN_COREUI_GO_ADDR=:$PORT ./app'
    healthCheckPath: /health

    # Persistent disk for SQLite database and uploads
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 10

    envVars:
      # ── Required ────────────────────────────────────────────────────────────
      - key: WEBUI_SECRET_KEY
        generateValue: true          # Render generates a random secret on first deploy

      # ── Optional: point at your Open WebUI Python backend ───────────────────
      # - key: OPEN_COREUI_PYTHON_BASE_URL
      #   value: https://your-open-webui-python.onrender.com

      # ── Optional: use PostgreSQL instead of SQLite ───────────────────────────
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: open-coreui-db
      #     property: connectionString

      # ── Optional: auth & signup ──────────────────────────────────────────────
      # - key: ENABLE_SIGNUP
      #   value: "true"
      # - key: DEFAULT_USER_ROLE
      #   value: user

      # ── Data directory (matches disk mountPath) ──────────────────────────────
      - key: DATA_DIR
        value: /app/data

# ── Optional: managed PostgreSQL (uncomment if you want Postgres) ─────────────
# databases:
#   - name: open-coreui-db
#     plan: free
